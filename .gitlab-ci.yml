variables:
    PLUGIN_NAME: 'deiaSurvey'

include:
  - project: 'documentacao-e-tarefas/modelosparaintegracaocontinua'
    ref: stable-3_3_0
    file:
      - 'templates/groups/pkp_plugin.yml'
      - 'templates/groups/ojs/unit_tests.yml'
      - 'templates/groups/ojs/cypress_tests.yml'
      - 'templates/groups/ops/cypress_tests.yml'

.unit_test_template:
  before_script:
    - sed -i 's/api_key_secret = ""/api_key_secret = "$API_KEY_SECRET"/' /var/www/$APPLICATION/config.inc.php

.integration_tests_template:
  before_script:
    - sed -i 's/api_key_secret = ""/api_key_secret = "$API_KEY_SECRET"/' /var/www/$CY_APPLICATION/config.inc.php

# Desabilita os jobs de testes de aceitação da aplicação, por enquanto
ojs_integration_tests:
  rules:
    - when: never

ops_integration_tests:
  rules:
    - when: never

# The regular env2 suite mocks AppLocale. Run the email flow with the real locale separately.
.execute_phpunit_tests:
  - TESTS=$(find -L $plugin_dir/$PLUGIN_NAME -maxdepth 1 -name tests -type d)
  - php lib/pkp/lib/vendor/phpunit/phpunit/phpunit --log-junit $CI_PROJECT_DIR/phpunit-report.xml --configuration lib/pkp/tests/phpunit-env2.xml $TESTS
  - php lib/pkp/lib/vendor/phpunit/phpunit/phpunit --log-junit $CI_PROJECT_DIR/phpunit-email-association-report.xml --configuration $plugin_dir/$PLUGIN_NAME/tests/phpunit-email-association.xml

plugin_unit_tests_ojs:
  parallel:
    matrix:
      - PHP_VERSION: ["8.1", "7.4"]
  artifacts:
    paths:
      - phpunit-report.xml
      - phpunit-email-association-report.xml
    when: always
    reports:
      junit:
        - phpunit-report.xml
        - phpunit-email-association-report.xml
